[project]
name = "alm"
version = "2.1.0"
description = "Educational Asset-Liability Management toolkit: insurer liabilities, backing assets, swaps, and duration/convexity hedging"
readme = "README.md"
authors = [
    { name = "Brennen Slaney", email = "bslaney7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coloredlogs>=15.0.1",
    "fredapi>=0.5.2",
    "great-tables>=0.21.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "plotly>=6.7.0",
    "polars>=1.39.3",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["alm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
source = ["src/alm"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.", "if TYPE_CHECKING:"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
